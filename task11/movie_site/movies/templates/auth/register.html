{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <link rel="stylesheet" href="{% static 'movies/css/style.css' %}">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: radial-gradient(circle at top, #1a1a1a, #000);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #141414;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 25px rgba(255, 211, 105, 0.15);
        }

        h2 {
            text-align: center;
            color: #ffd369;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
        }

        small {
            color: #aaa;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            background: #ffd369;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffb703;
        }

        a {
            color: #00d4ff;
            text-align: center;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Регистрация</h2>

    <form method="post">
        {% csrf_token %}

        <label>Логин</label>
        {{ form.username }}

        <label>Пароль</label>
        {{ form.password1 }}
        <small>Минимум 8 символов, нельзя простой пароль</small>

        <label>Повтор пароля</label>
        {{ form.password2 }}

        <button type="submit">Создать аккаунт</button>
    </form>

    <a href="{% url 'login' %}">Уже есть аккаунт?</a>
</div>

</body>
</html>
