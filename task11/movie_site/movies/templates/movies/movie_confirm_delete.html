{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Удалить фильм</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: radial-gradient(circle at top, #1a1a1a, #000);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #141414;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        button {
            background: red;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 10px;
            color: #00d4ff;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Удалить "{{ movie.title }}"?</h2>

    <form method="post">
        {% csrf_token %}
        <button>Да, удалить</button>
    </form>

    <a href="{% url 'movie_detail' movie.pk %}">Отмена</a>
</div>

</body>
</html>
